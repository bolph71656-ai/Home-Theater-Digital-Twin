name: R100B PFFDTD Complex Convergence

on:
  pull_request:
    paths:
      - 'backend/src/htdt/acoustic_benchmark.py'
      - 'backend/src/htdt/acoustic_bakeoff.py'
      - 'backend/src/htdt/acoustic_bakeoff_observation.py'
      - 'backend/src/htdt/acoustic_pffdtd_adapter.py'
      - 'backend/tests/test_acoustic_benchmark.py'
      - 'backend/tests/test_acoustic_bakeoff_convergence.py'
      - 'backend/tests/test_acoustic_pffdtd_adapter.py'
      - 'benchmarks/acoustics/r100a_manifest.json'
      - 'benchmarks/acoustics/r100b_candidates.json'
      - 'scripts/run_r100b_pffdtd_convergence.py'
      - '.github/workflows/r100b-pffdtd-convergence.yml'
  workflow_dispatch:

jobs:
  windows-complex-pressure-convergence:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PFFDTD_SHA: aa319f6c86517cb95aabfae8656277da62c3ead5
      PROBE_OUTPUT: artifacts/r100b/pffdtd_complex_convergence.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install HTDT and pinned PFFDTD probe runtime
        run: |
          python -m pip install -e ".\backend"
          python -m pip install "numpy==1.26.4" "numba==0.60.0" "scipy==1.14.1" "h5py==3.12.1" "tqdm==4.67.1" "psutil==6.1.1" "memory_profiler==0.61.0"

      - name: Checkout pinned PFFDTD source
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'pffdtd-r100b-convergence'
          git clone --filter=blob:none https://github.com/bsxfun/pffdtd.git $root
          git -C $root checkout --detach $env:PFFDTD_SHA
          $actual = (git -C $root rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:PFFDTD_SHA) {
            throw "PFFDTD checkout mismatch: $actual"
          }
          "PFFDTD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run R100A complex-pressure convergence probe
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'pffdtd-r100b-convergence-work'
          python scripts\run_r100b_pffdtd_convergence.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --upstream-root $env:PFFDTD_ROOT `
            --work-dir $work `
            --output $env:PROBE_OUTPUT

      - name: Show complex convergence evidence outcome
        shell: pwsh
        run: |
          $probe = Get-Content -Raw $env:PROBE_OUTPUT | ConvertFrom-Json
          Write-Host "R100B_PFFDTD_CONVERGENCE_OUTCOME=$($probe.probe_outcome)"
          Write-Host "R100B_R100A_HASH=$($probe.r100a_semantic_hash)"
          Write-Host "R100B_CANDIDATE_HASH=$($probe.candidate_manifest_hash)"
          if ($null -ne $probe.details.observable_evidence) {
            $ev = $probe.details.observable_evidence
            Write-Host "R100B_CONVERGENCE_STATUS=$($ev.status)"
            Write-Host "R100B_CONVERGENCE_ABS=$($ev.absolute_error)"
            Write-Host "R100B_CONVERGENCE_REL=$($ev.relative_error)"
          }
          if ($null -ne $probe.details.resources) {
            Write-Host "R100B_COMPILE_S=$($probe.details.resources.compile_s)"
            Write-Host "R100B_SOLVE_S=$($probe.details.resources.solve_s)"
            Write-Host "R100B_POSTPROCESS_S=$($probe.details.resources.postprocess_s)"
            Write-Host "R100B_PEAK_RAM_MB=$($probe.details.resources.peak_ram_mb)"
            Write-Host "R100B_DISK_MB=$($probe.details.resources.disk_mb)"
          }
          if ($null -ne $probe.error) {
            Write-Host "R100B_PFFDTD_CONVERGENCE_ERROR=$($probe.error)"
          }

      - name: Upload R100B PFFDTD convergence evidence
        uses: actions/upload-artifact@v4
        with:
          name: r100b-pffdtd-complex-convergence
          path: artifacts/r100b/pffdtd_complex_convergence*
          if-no-files-found: error

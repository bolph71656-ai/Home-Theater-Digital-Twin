name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e ".\backend[dev]"

      - name: Test backend
        run: python -m pytest backend\tests

      - name: Check backend launcher CLI
        run: python -m htdt --help

      - name: Check native CAD launcher CLI
        run: python -m htdt.wall_editor --help

      - name: Compile Windows CAD acceptance harnesses
        run: python -m py_compile scripts\validate_n20b_windows.py scripts\validate_n30a_windows.py scripts\validate_n30b_windows.py

      - name: Validate PowerShell scripts syntax
        shell: pwsh
        run: |
          Get-ChildItem '.\scripts\*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
              exit 1
            }
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Smoke test built local app
        run: python -m pytest backend\tests\test_built_frontend.py -q

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e ".\backend[dev]"

      - name: Test backend
        run: python -m pytest backend\tests

      - name: Check backend launcher CLI
        run: python -m htdt --help

      - name: Check native CAD launcher CLI
        run: python -m htdt.native_cad --help

      - name: Compile Windows CAD acceptance harnesses
        run: python -m py_compile scripts\validate_n20b_windows.py scripts\validate_n30a_windows.py scripts\validate_n30b_windows.py scripts\validate_n40_windows.py scripts\validate_n40_windows_gate.py scripts\validate_n40_precision_windows.py scripts\validate_n50_windows.py scripts\validate_n60_a12_windows.py scripts\validate_n60_a13_windows.py scripts\validate_n70_windows_base.py scripts\validate_n70_windows.py scripts\benchmark_n70_f5_windows.py scripts\validate_n80_windows.py scripts\validate_n80_o20_roomsim_windows.py scripts\validate_n80c_windows.py scripts\validate_n90_a15_windows.py scripts\audit_o60_owned_room.py

      - name: Validate PowerShell scripts syntax
        shell: pwsh
        run: |
          Get-ChildItem '.\scripts\*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
              exit 1
            }
          }

      - name: Preflight N60 hardware gate runner
        shell: pwsh
        run: .\scripts\run-n60-hardware-gate.ps1 -RepoRoot $PWD -PreflightOnly

      - name: Preflight N70 hardware gate runner
        shell: pwsh
        run: .\scripts\run-n70-hardware-gate.ps1 -RepoRoot $PWD -PreflightOnly

      - name: Preflight N80 hardware gate runner
        shell: pwsh
        run: .\scripts\run-n80-hardware-gate.ps1 -RepoRoot $PWD -PreflightOnly

      - name: Preflight N80 O20 hardware gate runner
        shell: pwsh
        run: .\scripts\run-n80-o20-hardware-gate.ps1 -RepoRoot $PWD -PreflightOnly

      - name: Preflight N80c hardware gate runner
        shell: pwsh
        run: .\scripts\run-n80c-hardware-gate.ps1 -RepoRoot $PWD -PreflightOnly

      - name: Preflight N90 hardware gate runner
        shell: pwsh
        run: .\scripts\run-n90-hardware-gate.ps1 -RepoRoot $PWD -PreflightOnly

      - name: Preflight O60R owned-room gate runner
        shell: pwsh
        run: .\scripts\run-o60-owned-room-gate.ps1 -RepoRoot $PWD -PreflightOnly
